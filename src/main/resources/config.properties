# Ulta AI-Powered Test Automation Configuration
# Environment: 'mock' (deterministic standalone testbed) or 'live' (direct to https://www.ulta.com/)
env=mock
base.url.live=https://www.ulta.com/
base.url.mock=http://localhost:8089/

# Browser Settings
browser=chrome
headless=true
window.maximize=true

# Timeouts in Seconds
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Slow Motion & Demo Navigation Settings
# Enables observable human-paced navigation and visual highlights in browser
slow.motion.enabled=true
action.delay.ms=1000
typing.delay.ms=50
visual.highlight.enabled=true

# Screenshot & Logging
screenshot.on.failure=true
screenshot.on.every.step=false

# Acceptance Criteria Relevance Thresholds (Percentages)
ac5.pdp.relevance.threshold=30.0
ac6.cart.relevance.threshold=25.0
ac7.e2e.relevance.threshold=20.0

# Relevant Keyword Dictionaries for Recommendation Analysis
keywords.moisturizer=hydrat, moisture, cream, lotion, skin, face, serum
keywords.mascara=lash, volume, mascara, eye, lengthening, waterproof, wand, defin
keywords.vitaminc=vitamin c, serum, brightening, antioxidant, radiant, skin, face, ascorbic
keywords.beauty.e2e=skin, face, cream, serum, eye, lip, makeup, beauty, hydrat, glow, lash, moisture, lotion, cleanser, toner, balm, foundation, blush, bronzer, mascara, primer, cosmetic
