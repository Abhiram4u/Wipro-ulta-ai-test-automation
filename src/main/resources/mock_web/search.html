<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | Ulta Beauty</title>
    <style>
        :root {
            --ulta-orange: #ff5000;
            --border-color: #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        header { border-bottom: 1px solid var(--border-color); background: #fff; padding: 16px 24px; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo a { font-size: 26px; font-weight: 900; color: var(--ulta-orange); text-decoration: none; }
        .search-wrapper { flex: 1; max-width: 600px; display: flex; position: relative; }
        .search-wrapper input { width: 100%; padding: 12px 48px 12px 18px; border: 1px solid #999; border-radius: 24px; font-size: 14px; outline: none; }
        .search-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: var(--ulta-orange); border: none; color: white; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        .cart-badge { background: var(--ulta-orange); color: white; border-radius: 50%; padding: 2px 7px; font-size: 12px; margin-left: 6px; }
        .container { max-width: 1280px; margin: 30px auto; padding: 0 24px; }
        .search-header { margin-bottom: 24px; }
        .search-header h1 { font-size: 26px; color: #222; }
        .result-count { color: #666; font-size: 14px; margin-top: 6px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .product-card { border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; padding: 16px; display: flex; flex-direction: column; transition: box-shadow 0.2s; background: #fff; }
        .product-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .product-img { width: 100%; height: 220px; object-fit: contain; background: #fdfdfd; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .product-brand { font-size: 12px; color: #777; text-transform: uppercase; font-weight: bold; margin-top: 12px; }
        .product-title { font-size: 16px; font-weight: 600; color: #222; margin: 6px 0; text-decoration: none; line-height: 1.3; }
        .product-title:hover { color: var(--ulta-orange); }
        .product-price { font-size: 16px; font-weight: 700; color: #111; margin-top: auto; padding-top: 12px; }
        .no-results { padding: 60px 0; text-align: center; color: #666; font-size: 18px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><a href="/index.html">ULTA BEAUTY</a></div>
            <form class="search-wrapper" action="/search.html" method="GET">
                <input type="search" name="q" id="search-input" data-testid="search-input" placeholder="Search..." autocomplete="off">
                <button type="submit" class="search-btn" id="search-button" data-testid="search-button">🔍</button>
            </form>
            <div>
                <a href="/cart.html" style="text-decoration:none; color:#222; font-weight:500;" id="cart-icon" data-testid="cart-icon">
                    🛍️ Bag <span class="cart-badge" id="cart-count-badge" data-testid="cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="search-header">
            <h1 id="search-results-title">Results for "<span id="query-term"></span>"</h1>
            <div class="result-count" id="result-count-label" data-testid="result-count-label">Loading products...</div>
        </div>

        <div class="product-grid" id="product-grid" data-testid="product-grid">
            <!-- Dynamically populated or default fallback -->
        </div>
        <div class="no-results" id="no-results-msg" style="display:none;" data-testid="no-results-message">
            No products found matching your search. Please try another keyword.
        </div>
    </div>

    <script>
        const catalog = {
            "moisturizer": [
                {
                    id: "m1",
                    brand: "CeraVe",
                    title: "CeraVe Daily Moisturizing Lotion for Dry Skin",
                    price: "$17.99",
                    icon: "🧴",
                    url: "/pdp_moisturizer.html"
                },
                {
                    id: "m2",
                    brand: "Clinique",
                    title: "Clinique Moisture Surge 100H Auto-Replenishing Hydrator Cream",
                    price: "$44.00",
                    icon: "💧",
                    url: "/pdp_moisturizer.html"
                },
                {
                    id: "m3",
                    brand: "First Aid Beauty",
                    title: "Ultra Repair Cream Intense Hydration Face Lotion",
                    price: "$38.00",
                    icon: "🧴",
                    url: "/pdp_moisturizer.html"
                }
            ],
            "mascara": [
                {
                    id: "mas1",
                    brand: "Maybelline",
                    title: "Maybelline Lash Sensational Sky High Waterproof Mascara",
                    price: "$12.99",
                    icon: "👁️",
                    url: "/pdp_mascara.html"
                },
                {
                    id: "mas2",
                    brand: "Too Faced",
                    title: "Better Than Sex Volumizing & Lengthening Mascara",
                    price: "$29.00",
                    icon: "✨",
                    url: "/pdp_mascara.html"
                },
                {
                    id: "mas3",
                    brand: "Benefit Cosmetics",
                    title: "They're Real! Lengthening Mascara for Dramatic Lashes",
                    price: "$28.00",
                    icon: "👁️",
                    url: "/pdp_mascara.html"
                }
            ],
            "vitamin c serum": [
                {
                    id: "vc1",
                    brand: "TruSkin",
                    title: "TruSkin Vitamin C Facial Serum with Hyaluronic Acid",
                    price: "$21.99",
                    icon: "🍊",
                    url: "/pdp_vitaminc.html"
                },
                {
                    id: "vc2",
                    brand: "La Roche-Posay",
                    title: "Pure Vitamin C10 Serum Brightening Antioxidant Face Elixir",
                    price: "$44.99",
                    icon: "✨",
                    url: "/pdp_vitaminc.html"
                },
                {
                    id: "vc3",
                    brand: "Sunday Riley",
                    title: "C.E.O. 15% Vitamin C Brightening Serum for Glowing Skin",
                    price: "$85.00",
                    icon: "🌟",
                    url: "/pdp_vitaminc.html"
                }
            ]
        };

        const params = new URLSearchParams(window.location.search);
        let rawQuery = params.get('q') || '';
        let query = rawQuery.trim().toLowerCase();
        document.getElementById('query-term').innerText = rawQuery;
        document.getElementById('search-input').value = rawQuery;

        // Support matching
        let matched = [];
        if (query.includes('moistur')) {
            matched = catalog['moisturizer'];
        } else if (query.includes('mascara')) {
            matched = catalog['mascara'];
        } else if (query.includes('vitamin') || query.includes('serum')) {
            matched = catalog['vitamin c serum'];
        } else if (query.length > 0) {
            // General keyword search across catalog
            Object.values(catalog).flat().forEach(p => {
                if (p.title.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query)) {
                    matched.push(p);
                }
            });
        }

        const grid = document.getElementById('product-grid');
        const countLabel = document.getElementById('result-count-label');
        const noResults = document.getElementById('no-results-msg');

        if (matched.length > 0) {
            countLabel.innerText = `Showing ${matched.length} product(s) found`;
            grid.innerHTML = matched.map((p, idx) => `
                <div class="product-card" data-testid="product-card" id="product-${idx}">
                    <div class="product-img">${p.icon}</div>
                    <div class="product-brand">${p.brand}</div>
                    <a href="${p.url}" class="product-title" data-testid="product-link" id="product-link-${idx}">${p.title}</a>
                    <div class="product-price">${p.price}</div>
                </div>
            `).join('');
        } else {
            countLabel.innerText = "0 products found";
            grid.style.display = 'none';
            noResults.style.display = 'block';
        }

        function syncCart() {
            const cart = JSON.parse(localStorage.getItem('ulta_cart') || '[]');
            const badge = document.getElementById('cart-count-badge');
            if (badge) badge.innerText = cart.length;
        }
        syncCart();
    </script>
</body>
</html>
